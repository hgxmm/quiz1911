<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Live – Admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  body.light { background: #f3f0f9; color: var(--text); }
  .wrap { width: 100%; max-width: 920px; margin: 0 auto; padding: 24px 20px 80px; }
  h2 { margin: 0; }
  .row { display: flex; gap: 10px; align-items: center; }
  .spacer { flex: 1; }

  /* Quiz list */
  .quiz-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
  .quiz-item { display: flex; flex-direction: column; gap: 10px; }
  .quiz-item h3 { margin: 0; font-size: 18px; word-break: break-word; }
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }

  /* Editor */
  .q-card { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .q-head { display: flex; align-items: center; gap: 8px; }
  .q-num { font-weight: 900; color: var(--bg); }
  .q-body { display: grid; grid-template-columns: 1fr 220px; gap: 14px; }
  @media (max-width: 700px) { .q-body { grid-template-columns: 1fr; } }
  .img-drop {
    border: 2px dashed var(--border); border-radius: 8px; min-height: 140px; display: grid; place-items: center;
    color: var(--muted); font-size: 14px; cursor: pointer; position: relative; overflow: hidden; text-align: center; padding: 8px;
  }
  .img-drop:hover { border-color: var(--bg); }
  .img-drop img { max-width: 100%; max-height: 180px; display: block; border-radius: 6px; }
  .img-remove { position: absolute; top: 6px; right: 6px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .opts { grid-template-columns: 1fr; } }
  .opt { display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 6px 8px 6px 10px; }
  .opt input[type=text] { border: 0; padding: 10px; }
  .opt .shape { width: 22px; height: 22px; }
  .opt label.correct { display: flex; align-items: center; gap: 4px; color: #fff; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .opt input[type=radio] { width: 20px; height: 20px; accent-color: #fff; cursor: pointer; }
  .opt .rm { background: rgba(0,0,0,.25); color: #fff; border: 0; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-weight: 900; }
  label.lbl { font-size: 13px; font-weight: 800; color: var(--muted); display: block; margin-bottom: 4px; }
  .sticky-save { position: sticky; top: 0; z-index: 5; background: #f3f0f9; padding: 12px 0; }

  /* Host */
  .host-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: rgba(0,0,0,.2); font-weight: 800; }
  .pin-box { background: #fff; color: var(--text); border-radius: 10px; padding: 14px 28px; display: inline-flex; flex-direction: column; align-items: center; box-shadow: var(--shadow); }
  .pin-box .pin { font-size: 64px; font-weight: 900; letter-spacing: 4px; line-height: 1.1; }
  .players { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 900px; margin: 24px auto; }
  .chip { background: rgba(0,0,0,.25); padding: 10px 16px; border-radius: 8px; font-weight: 800; font-size: 18px; cursor: pointer; animation: slideIn .3s both; }
  .chip:hover { text-decoration: line-through; background: var(--red); }
  .host-q-text { background: #fff; color: var(--text); font-size: 30px; font-weight: 800; text-align: center; padding: 18px 24px; }
  .host-mid { flex: 1; display: grid; grid-template-columns: 140px 1fr 140px; align-items: center; padding: 20px; gap: 20px; }
  .timer-circle { width: 110px; height: 110px; border-radius: 50%; background: var(--bg-dark); display: grid; place-items: center; font-size: 44px; font-weight: 900; justify-self: center; }
  .host-img { max-width: 100%; max-height: 42vh; border-radius: 8px; justify-self: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .ans-count { text-align: center; font-weight: 800; }
  .ans-count b { display: block; font-size: 44px; }
  .host-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
  .host-opt { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 8px; font-size: 22px; font-weight: 800; box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); transition: opacity .3s; word-break: break-word; }
  .host-opt.dim { opacity: .3; }
  .host-opt .tick { margin-left: auto; font-size: 28px; }
  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 18px; height: 34vh; margin: 20px auto; }
  .bar { width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .bar .fill { width: 100%; border-radius: 6px 6px 0 0; min-height: 8px; transition: height .6s ease-out; }
  .bar .lab { width: 100%; border-radius: 0 0 6px 6px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-weight: 900; font-size: 20px; }
  .bar.dim { opacity: .35; }
</style>
</head>
<body>

<!-- Login -->
<section id="v-login" class="screen center">
  <div class="logo">Quiz<span>Live</span> Admin</div>
  <form id="login-form" class="card form-card">
    <input id="password" class="big-input" type="password" placeholder="Mật khẩu admin" autofocus>
    <button class="btn dark" type="submit">Đăng nhập</button>
    <div id="login-err" class="error"></div>
  </form>
</section>

<!-- Dashboard -->
<section id="v-list" class="screen hidden">
  <div class="topbar">
    <span class="brand">QuizLive Admin</span>
    <div class="row"><a class="btn small light" href="/" target="_blank">Trang người chơi ↗</a><button class="btn small ghost" onclick="logout()">Đăng xuất</button></div>
  </div>
  <div class="wrap">
    <div class="row" style="flex-wrap:wrap"><h2 style="color:var(--text)">Bộ câu hỏi của bạn</h2><span class="spacer"></span>
      <button class="btn light small" onclick="exportFile()" title="Tải toàn bộ quiz về máy">⬇ Xuất file</button>
      <button class="btn light small" onclick="$('import-input').click()" title="Nạp quiz từ file đã xuất">⬆ Nhập file</button>
      <button class="btn primary" onclick="openEditor()">+ Tạo quiz mới</button></div>
    <input type="file" id="import-input" accept=".json,application/json" class="hidden">
    <div id="quiz-list" class="quiz-list"></div>
  </div>
</section>

<!-- Editor -->
<section id="v-editor" class="screen hidden">
  <div class="topbar">
    <span class="brand">QuizLive Admin</span>
    <button class="btn small ghost" onclick="backToList()">← Quay lại</button>
  </div>
  <div class="wrap">
    <div class="sticky-save row">
      <input id="quiz-title" type="text" placeholder="Tên quiz (vd: Kiến thức chung)" style="font-weight:800;font-size:20px">
      <button class="btn success" onclick="saveQuiz()">Lưu</button>
    </div>
    <div id="editor-err" class="error"></div>
    <div id="questions"></div>
    <button class="btn light" style="margin-top:16px;width:100%;border:2px dashed var(--border)" onclick="addQuestion()">+ Thêm câu hỏi</button>
  </div>
</section>

<!-- Host: lobby -->
<section id="v-lobby" class="screen hidden">
  <div class="host-top"><span id="lobby-title"></span><button class="btn small danger" onclick="closeGame()">Đóng game</button></div>
  <div class="screen center" style="min-height:auto;flex:1">
    <p style="font-size:20px;margin:0 0 10px">Vào <b id="join-url"></b> và nhập mã PIN</p>
    <div class="pin-box"><span class="muted" style="font-weight:800">Game PIN</span><span class="pin" id="lobby-pin">------</span></div>
    <div class="row" style="margin-top:24px;gap:16px">
      <span style="font-size:22px;font-weight:900"><span id="player-count">0</span> người chơi</span>
      <button class="btn dark" id="start-btn" disabled onclick="startGame()">Bắt đầu ▶</button>
    </div>
    <div id="players" class="players"></div>
    <p id="waiting-text" style="opacity:.75">Đang chờ người chơi... (bấm vào tên để mời ra)</p>
  </div>
</section>

<!-- Host: get ready -->
<section id="v-ready" class="screen center hidden">
  <h2 id="ready-label" style="font-size:28px"></h2>
  <h1 id="ready-text" style="font-size:40px;max-width:900px"></h1>
  <div class="countdown-big" id="ready-count">3</div>
</section>

<!-- Host: question -->
<section id="v-question" class="screen hidden">
  <div class="host-q-text" id="hq-text"></div>
  <div class="host-mid">
    <div class="timer-circle" id="hq-timer">20</div>
    <div style="display:grid;place-items:center"><img id="hq-img" class="host-img hidden" alt=""></div>
    <div class="ans-count"><b id="hq-answered">0</b>câu trả lời<br><button class="btn small light" style="margin-top:10px" onclick="socket.emit('host:skip')">Bỏ qua ⏭</button></div>
  </div>
  <div class="host-opts" id="hq-opts"></div>
</section>

<!-- Host: result -->
<section id="v-result" class="screen hidden">
  <div class="host-q-text" id="hr-text"></div>
  <div style="display:flex;justify-content:flex-end;padding:14px 20px 0"><button class="btn light" id="hr-next" onclick="showScoreboard()">Tiếp ▶</button></div>
  <div class="bars" id="hr-bars"></div>
  <div class="host-opts" id="hr-opts"></div>
</section>

<!-- Host: scoreboard -->
<section id="v-score" class="screen center hidden">
  <div style="width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h1 style="margin:0">Bảng điểm</h1>
    <button class="btn light" onclick="socket.emit('host:next')">Câu tiếp theo ▶</button>
  </div>
  <div class="board" id="score-board"></div>
</section>

<!-- Host: final -->
<section id="v-final" class="screen center hidden">
  <h1 id="final-title" style="font-size:36px;margin:0"></h1>
  <div class="podium" id="podium"></div>
  <div class="board" id="final-rest"></div>
  <div class="row" style="margin-top:28px"><button class="btn light" onclick="closeGame()">Về trang quản lý</button></div>
</section>

<input type="file" id="file-input" accept="image/*" class="hidden">

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const views = ['login','list','editor','lobby','ready','question','result','score','final'];
function show(v) {
  views.forEach(x => $('v-' + x).classList.toggle('hidden', x !== v));
  document.body.classList.toggle('light', ['list','editor'].includes(v));
  window.scrollTo(0, 0);
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
const TIMES = [5, 10, 20, 30, 60, 90, 120];

let adminKey = sessionStorage.getItem('adminKey') || '';
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('Phiên đăng nhập hết hạn'); }
  if (!res.ok) throw new Error(data.error || 'Lỗi server');
  return data;
}

// ---------- Auth ----------
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('password').value;
  const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
  if (!res.ok) return $('login-err').textContent = 'Sai mật khẩu';
  adminKey = pw; sessionStorage.setItem('adminKey', pw);
  loadList();
});
function logout() { adminKey = ''; sessionStorage.removeItem('adminKey'); show('login'); }

// ---------- Backup (browser copy + file export/import) ----------
const BACKUP_KEY = 'quizlive_backup';
async function syncBackup() {
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(await api('GET', '/api/export'))); }
  catch (e) { console.warn('Backup failed', e); }
}
function readBackup() { try { return JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); } catch { return []; } }
async function exportFile() {
  const data = await api('GET', '/api/export');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `quizlive-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}
$('import-input').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const r = await api('POST', '/api/import', JSON.parse(await f.text()));
    toast(`Đã nhập ${r.added} quiz`); e.target.value = ''; loadList();
  } catch (err) { toast('File không hợp lệ: ' + err.message); }
});

// ---------- List ----------
async function loadList() {
  try {
    let list = await api('GET', '/api/quizzes');
    // Server lost its data (e.g. free host restarted) -> restore from this browser's copy
    const backup = readBackup();
    if (list.length === 0 && backup.length) {
      const r = await api('POST', '/api/import', backup);
      if (r.added) { toast(`Đã khôi phục ${r.added} quiz từ bản lưu trên trình duyệt`); list = await api('GET', '/api/quizzes'); }
    } else if (list.length) syncBackup();
    $('quiz-list').innerHTML = list.length ? list.map(q => `
      <div class="card quiz-item">
        <h3>${esc(q.title)}</h3>
        <span class="muted">${q.count} câu hỏi</span>
        <div class="row">
          <button class="btn primary small" style="flex:1" onclick="hostGame('${q.id}')">▶ Host game</button>
          <button class="btn light small" onclick="openEditor('${q.id}')">Sửa</button>
          <button class="btn light small" onclick="deleteQuiz('${q.id}')" title="Xoá">🗑</button>
        </div>
      </div>`).join('')
      : `<div class="empty card" style="grid-column:1/-1">Chưa có quiz nào. Bấm <b>+ Tạo quiz mới</b> để bắt đầu.</div>`;
    show('list');
  } catch (e) { toast(e.message); }
}
async function deleteQuiz(id) {
  if (!confirm('Xoá quiz này?')) return;
  await api('DELETE', '/api/quizzes/' + id);
  await syncBackup(); loadList();
}

// ---------- Editor ----------
let editing = { id: null, title: '', questions: [] };
const blankQuestion = () => ({ text: '', image: null, options: ['', '', '', ''], correct: 0, time: 20 });

async function openEditor(id) {
  $('editor-err').textContent = '';
  if (id) {
    try { const q = await api('GET', '/api/quizzes/' + id); editing = { id: q.id, title: q.title, questions: q.questions }; }
    catch (e) { return toast(e.message); }
  } else editing = { id: null, title: '', questions: [blankQuestion()] };
  $('quiz-title').value = editing.title;
  renderQuestions();
  show('editor');
}
function backToList() { if (confirm('Thoát mà không lưu?')) loadList(); }
function addQuestion() { editing.questions.push(blankQuestion()); renderQuestions(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0); }

function renderQuestions() {
  $('questions').innerHTML = editing.questions.map((q, qi) => `
    <div class="card q-card">
      <div class="q-head">
        <span class="q-num">Câu ${qi + 1}</span><span class="spacer"></span>
        <button class="btn small light" onclick="moveQ(${qi},-1)" ${qi === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn small light" onclick="moveQ(${qi},1)" ${qi === editing.questions.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="btn small light" onclick="dupQ(${qi})" title="Nhân bản">⧉</button>
        <button class="btn small danger" onclick="removeQ(${qi})" ${editing.questions.length === 1 ? 'disabled' : ''}>Xoá</button>
      </div>
      <div class="q-body">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div><label class="lbl">Nội dung câu hỏi</label>
            <textarea rows="2" oninput="editing.questions[${qi}].text=this.value" placeholder="Nhập câu hỏi...">${esc(q.text)}</textarea></div>
          <div><label class="lbl">Thời gian đếm ngược</label>
            <select onchange="editing.questions[${qi}].time=Number(this.value)">
              ${TIMES.map(t => `<option value="${t}" ${q.time === t ? 'selected' : ''}>${t} giây</option>`).join('')}
            </select></div>
        </div>
        <div><label class="lbl">Hình ảnh (tuỳ chọn)</label>
          <div class="img-drop" onclick="pickImage(${qi})" ondragover="event.preventDefault()" ondrop="dropImage(event, ${qi})">
            ${q.image ? `<img src="${q.image}" alt=""><button class="btn small danger img-remove" onclick="event.stopPropagation();removeImage(${qi})">✕</button>`
                      : `<span>Bấm hoặc kéo thả ảnh vào đây</span>`}
          </div></div>
      </div>
      <div><label class="lbl">Đáp án — chọn ô "Đúng" cho đáp án chính xác</label>
        <div class="opts">
          ${q.options.map((o, oi) => `
            <div class="opt c${oi}">
              <span class="shape s${oi}"></span>
              <input type="text" value="${esc(o)}" placeholder="Đáp án ${oi + 1}${oi >= 2 ? ' (tuỳ chọn)' : ''}" oninput="editing.questions[${qi}].options[${oi}]=this.value">
              <label class="correct"><input type="radio" name="c${qi}" ${q.correct === oi ? 'checked' : ''} onchange="editing.questions[${qi}].correct=${oi}">Đúng</label>
              ${q.options.length > 2 ? `<button class="rm" title="Bỏ đáp án" onclick="removeOpt(${qi},${oi})">✕</button>` : ''}
            </div>`).join('')}
        </div>
        ${q.options.length < 4 ? `<button class="btn small light" style="margin-top:10px" onclick="addOpt(${qi})">+ Thêm đáp án</button>` : ''}
      </div>
    </div>`).join('');
}
function moveQ(i, d) { const a = editing.questions; [a[i], a[i + d]] = [a[i + d], a[i]]; renderQuestions(); }
function dupQ(i) { editing.questions.splice(i + 1, 0, JSON.parse(JSON.stringify(editing.questions[i]))); renderQuestions(); }
function removeQ(i) { if (confirm(`Xoá câu ${i + 1}?`)) { editing.questions.splice(i, 1); renderQuestions(); } }
function addOpt(qi) { editing.questions[qi].options.push(''); renderQuestions(); }
function removeOpt(qi, oi) {
  const q = editing.questions[qi]; q.options.splice(oi, 1);
  if (q.correct === oi) q.correct = 0; else if (q.correct > oi) q.correct--;
  renderQuestions();
}

// Images: resized client-side to max 1200px and stored as JPEG data URL
let pickTarget = null;
function pickImage(qi) { pickTarget = qi; $('file-input').value = ''; $('file-input').click(); }
$('file-input').addEventListener('change', (e) => { if (e.target.files[0] && editing.questions[pickTarget]) setImage(pickTarget, e.target.files[0]); });
function dropImage(e, qi) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) setImage(qi, f); }
function removeImage(qi) { editing.questions[qi].image = null; renderQuestions(); }
function setImage(qi, file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1200, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      editing.questions[qi].image = c.toDataURL('image/jpeg', 0.85);
      renderQuestions();
    };
    img.onerror = () => toast('Không đọc được ảnh');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function saveQuiz() {
  $('editor-err').textContent = '';
  const body = {
    title: $('quiz-title').value,
    // Drop empty optional answers (3rd/4th) and keep "correct" pointing at the right one
    questions: editing.questions.map(q => {
      const keep = q.options.map((o, i) => ({ o: o.trim(), i })).filter((x, idx) => x.o || idx < 2);
      return { ...q, options: keep.map(x => x.o), correct: keep.findIndex(x => x.i === q.correct) };
    }),
  };
  try {
    if (editing.id) await api('PUT', '/api/quizzes/' + editing.id, body);
    else await api('POST', '/api/quizzes', body);
    toast('Đã lưu quiz'); loadList();
  } catch (e) { $('editor-err').textContent = e.message; window.scrollTo(0, 0); }
}

// ---------- Hosting ----------
const socket = io();
let game = null, timerInt = null, lastResult = null, currentQ = null;

function hostGame(quizId) {
  socket.emit('host:create', { key: adminKey, quizId }, (res) => {
    if (res.error) return toast(res.error);
    game = res;
    $('lobby-title').textContent = res.title + ` · ${res.total} câu`;
    $('lobby-pin').textContent = res.pin;
    $('join-url').textContent = location.host;
    renderPlayers([]);
    show('lobby');
  });
}
function closeGame() {
  if (game && !confirm('Đóng game hiện tại?')) return;
  game = null; clearInterval(timerInt);
  socket.disconnect(); socket.connect(); // server cleans up the game on host disconnect
  loadList();
}
function renderPlayers(list) {
  $('player-count').textContent = list.length;
  $('start-btn').disabled = list.length === 0;
  $('players').innerHTML = list.map(p => `<span class="chip" title="Mời ra" onclick="socket.emit('host:kick',{playerId:'${p.id}'})">${esc(p.name)}</span>`).join('');
}
socket.on('players', renderPlayers);
function startGame() { socket.emit('host:start'); }

socket.on('question', (q) => {
  currentQ = q; clearInterval(timerInt);
  const offset = q.serverNow - Date.now();
  const now = () => Date.now() + offset;
  $('ready-label').textContent = `Câu ${q.index + 1} / ${q.total}`;
  $('ready-text').textContent = q.text;
  $('hq-text').textContent = q.text;
  $('hq-answered').textContent = 0;
  const img = $('hq-img');
  if (q.image) { img.src = q.image; img.classList.remove('hidden'); } else img.classList.add('hidden');
  $('hq-opts').innerHTML = q.options.map((o, i) => `<div class="host-opt c${i}"><span class="shape s${i}"></span><span>${esc(o)}</span></div>`).join('');
  show('ready');
  let shown = false;
  const tick = () => {
    const t = now();
    if (t < q.startsAt) { $('ready-count').textContent = Math.ceil((q.startsAt - t) / 1000); return; }
    if (!shown) { shown = true; show('question'); }
    $('hq-timer').textContent = Math.max(0, Math.ceil((q.startsAt + q.time * 1000 - t) / 1000));
  };
  tick(); timerInt = setInterval(tick, 200);
});
socket.on('answer:count', ({ answered }) => { $('hq-answered').textContent = answered; });

socket.on('question:result', (r) => {
  clearInterval(timerInt);
  lastResult = r;
  const q = currentQ;
  $('hr-text').textContent = q.text;
  const max = Math.max(1, ...r.counts);
  $('hr-bars').innerHTML = r.counts.map((n, i) => `
    <div class="bar ${i === r.correct ? '' : 'dim'}">
      <div class="fill c${i}" style="height:0%" data-h="${(n / max) * 80}"></div>
      <div class="lab c${i}"><span class="shape s${i}" style="width:20px;height:20px"></span>${n}${i === r.correct ? ' ✓' : ''}</div>
    </div>`).join('');
  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('#hr-bars .fill').forEach(f => f.style.height = f.dataset.h + '%'), 50));
  $('hr-opts').innerHTML = q.options.map((o, i) => `<div class="host-opt c${i} ${i === r.correct ? '' : 'dim'}"><span class="shape s${i}"></span><span>${esc(o)}</span>${i === r.correct ? '<span class="tick">✓</span>' : ''}</div>`).join('');
  $('hr-next').textContent = r.isLast ? 'Xem kết quả 🏆' : 'Tiếp ▶';
  show('result');
});
function showScoreboard() {
  if (lastResult.isLast) return socket.emit('host:next');
  $('score-board').innerHTML = lastResult.top.map((p, i) =>
    `<div class="board-row r${p.rank}" style="animation-delay:${i * .1}s"><span class="rk">${p.rank}</span><span class="nm">${esc(p.name)}</span><span>${p.score}</span></div>`).join('');
  show('score');
}

socket.on('game:over', ({ top5, totalPlayers }) => {
  $('final-title').textContent = `🏆 Top ${Math.min(5, totalPlayers)} người chơi xuất sắc`;
  const order = [1, 0, 2]; // 2nd, 1st, 3rd
  $('podium').innerHTML = order.filter(i => top5[i]).map(i => `
    <div class="col p${i + 1}">
      <span class="name">${esc(top5[i].name)}</span><span class="pts">${top5[i].score} điểm</span>
      <div class="block">${i + 1}</div>
    </div>`).join('');
  $('final-rest').innerHTML = top5.slice(3).map((p, i) =>
    `<div class="board-row" style="animation-delay:${1.3 + i * .15}s"><span class="rk">${p.rank}</span><span class="nm">${esc(p.name)}</span><span>${p.score}</span></div>`).join('');
  show('final');
  game = null;
});

// Boot
if (adminKey) loadList(); else show('login');
</script>
</body>
</html>
